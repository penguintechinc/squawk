# ==========================================================================
# DEPRECATED: Docker Compose support has been deprecated.
# Kubernetes (microk8s) with Helm v3 is now the standard deployment method.
#
# Use instead:
#   Alpha:  make k8s-alpha-deploy
#   Beta:   make k8s-beta-deploy
#   Prod:   make k8s-prod-deploy
#
# See k8s/helm/squawk/ for Helm charts and values files.
# This file is retained for reference only and will be removed in a future release.
# ==========================================================================

version: '3.8'

services:
  # DNS Server with Enterprise Features
  dns-server:
    build:
      context: ./dns-server
      dockerfile: Dockerfile
    image: squawk-dns-server:latest
    container_name: squawk-dns-server
    restart: unless-stopped
    ports:
      - "8080:8080"  # DNS-over-HTTPS API
      - "8444:8443"  # DNS-over-HTTPS API (TLS)
    environment:
      - PORT=8080
      - USE_NEW_AUTH=true
      - LOG_LEVEL=INFO
      - ENABLE_BLACKLIST=false
      - CACHE_ENABLED=true
      - CACHE_TTL=300
      - VALKEY_URL=redis://valkey:6379
      - ENABLE_MTLS=false
      - CERT_DIR=/app/certs
    # volumes removed for local validation to avoid permission issues

    networks:
      squawk-network:
        ipv4_address: 172.25.0.10
    depends_on:
      - valkey
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Flask API Backend (JSON-only, JWT + CORS)
  flask-api:
    build:
      context: ./dns-server
      dockerfile: Dockerfile.api
    image: squawk-flask-api:latest
    container_name: squawk-flask-api
    restart: unless-stopped
    ports:
      - "8005:8000"  # Flask API
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - JWT_ACCESS_TOKEN_HOURS=1
      - JWT_REFRESH_TOKEN_DAYS=30
      - CORS_ORIGINS=http://localhost:3000,http://dns-webui:3000
      - DATABASE_URI=${DATABASE_URI:-sqlite://storage.db}
      - LOG_LEVEL=INFO
    networks:
      - squawk-network
    depends_on:
      - dns-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Web Console (Nginx + Vite build)
  dns-webui:
    build:
      context: .
      dockerfile: services/dns-webui/Dockerfile
    image: squawk-dns-webui:latest
    container_name: squawk-dns-webui
    restart: unless-stopped
    ports:
      - "3003:3000"  # Web console UI
    environment:
      - VITE_API_URL=http://flask-api:8000
    networks:
      - squawk-network
    depends_on:
      - flask-api

  # Squawk Client Forwarder (DNS, DHCP, NTP)
  squawk-client:
    build:
      context: ./squawk-client
      dockerfile: Dockerfile
    image: squawk-client:latest
    container_name: squawk-client
    restart: unless-stopped
    ports:
      - "5353:53/udp"
      - "5353:53/tcp"
    cap_add:
      - NET_ADMIN  # Required for DNS port binding
    environment:
      - SQUAWK_SERVER_URL=http://172.25.0.10:8080
      - SQUAWK_AUTH_TOKEN=${AUTH_TOKEN}
      - LOG_LEVEL=INFO
      - SQUAWK_VERIFY_SSL=false
    volumes:
      - ./squawk-client/data:/app/data
      - ./squawk-client/logs:/app/logs
      - ./squawk-client/certs:/app/certs
    networks:
      - squawk-network
    depends_on:
      - dns-server

  # Valkey/Redis Cache
  valkey:
    image: valkey/valkey:latest@sha256:3eeb09785cd61ec8e3be35f8804c8892080f3ca21934d628abc24ee4ed1698f6
    container_name: squawk-valkey
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - valkey-data:/data
    networks:
      - squawk-network
    command: ["valkey-server", "--appendonly", "yes"]

  # DHCP-over-HTTPS Server (optional)
  dhcp-server:
    build:
      context: ./dhcp-server
      dockerfile: Dockerfile
    image: squawk-dhcp-server:latest
    container_name: squawk-dhcp-server
    restart: unless-stopped
    ports:
      - "8081:8081"  # DHCP-over-HTTPS API
    environment:
      - DHCP_PORT=8081
      - AUTH_REQUIRED=true
      - SHARED_AUTH_URL=http://172.25.0.10:8080
      - DHCP_POOL_SUBNET=192.168.1.0/24
      - DHCP_POOL_START=192.168.1.100
      - DHCP_POOL_END=192.168.1.200
      - DHCP_GATEWAY=192.168.1.1
      - DHCP_DNS_SERVERS=8.8.8.8,8.8.4.4
      - DHCP_LEASE_TIME=86400
    networks:
      squawk-network:
        ipv4_address: 172.25.0.11
    depends_on:
      - dns-server
    profiles:
      - dhcp  # Only start with --profile dhcp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NTP/NTS Server (optional)
  ntp-server:
    build:
      context: ./ntp-server
      dockerfile: Dockerfile
    image: squawk-ntp-server:latest
    container_name: squawk-ntp-server
    restart: unless-stopped
    ports:
      - "8082:8082"  # NTP-over-HTTPS API
      - "4460:4460"  # NTS Key Establishment
    environment:
      - NTP_PORT=8082
      - NTS_KE_PORT=4460
      - AUTH_REQUIRED=true
      - SHARED_AUTH_URL=http://172.25.0.10:8080
      - UPSTREAM_NTP=pool.ntp.org
    networks:
      squawk-network:
        ipv4_address: 172.25.0.12
    depends_on:
      - dns-server
    profiles:
      - ntp  # Only start with --profile ntp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database (optional - for enterprise deployments)
  postgres:
    image: postgres:16-bookworm@sha256:7858a1a43bb2e3decc07650c8989ba526e0a8164f212c9bb88b622cdbd71c4be
    container_name: squawk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: squawk
      POSTGRES_USER: squawk_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - squawk-network
    profiles:
      - postgres  # Only start with --profile postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squawk_user -d squawk"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Prometheus Monitoring (optional)
  prometheus:
    image: prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
    container_name: squawk-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - squawk-network
    profiles:
      - monitoring  # Only start with --profile monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana Dashboard (optional)
  grafana:
    image: grafana/grafana:12.4.2@sha256:83749231c3835e390a3144e5e940203e42b9589761f20ef3169c716e734ad505
    container_name: squawk-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - squawk-network
    profiles:
      - monitoring  # Only start with --profile monitoring
    depends_on:
      - prometheus

  # Test Runner (unified build with test environment)
  test-runner:
    build:
      context: ./dns-server
      dockerfile: Dockerfile
      args:
        - SQUAWK_ENV=test
    image: squawk-dns-server:latest
    container_name: squawk-test-runner
    environment:
      - SQUAWK_ENV=test
    volumes:
      - ./dns-server:/app/dns-server
    working_dir: /app/dns-server
    networks:
      - squawk-network
    profiles:
      - testing  # Only start with --profile testing

networks:
  squawk-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  valkey-data:
  postgres-data:
  prometheus-data:
  grafana-data: