{% extends "base.html" %}

{% block title %}Register - Squawk DNS{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 100px auto;">
    <h1 style="margin-bottom: 30px; text-align: center; color: #667eea;">Create Account</h1>

    <form method="POST">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>

        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Register</button>
    </form>

    <p style="text-align: center; margin-top: 20px;">
        Already have an account? <a href="{{ url_for('auth.login') }}" style="color: #667eea;">Login</a>
    </p>
</div>
{% endblock %}
