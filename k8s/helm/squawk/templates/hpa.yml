    kind: Deployment
    name: ntp-server
  minReplicas: {{ .Values.ntpServer.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.ntpServer.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ntpServer.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: squawk-client
  namespace: {{ include "squawk.namespace" . }}
  labels:
    {{- include "squawk.dnsClient.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: squawk-client
  minReplicas: {{ .Values.dnsClient.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.dnsClient.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.dnsClient.autoscaling.targetCPUUtilizationPercentage }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: k8s-dns
  namespace: {{ include "squawk.namespace" . }}
  labels:
    {{- include "squawk.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-dns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: k8s-dns
  minReplicas: {{ .Values.k8sDns.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.k8sDns.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.k8sDns.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
