apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
  namespace: squawk
  labels:
    app.kubernetes.io/name: squawk
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: flask-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: squawk
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: flask-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squawk
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: flask-api
    spec:
      containers:
      - name: flask-api
        image: squawk-flask-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: DATABASE_URL
          value: "sqlite:////data/squawk.db"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: squawk-secrets
              key: secret-key
              optional: true
        - name: LOG_LEVEL
          value: "info"
        - name: FLASK_ENV
          value: "production"
        - name: VALKEY_HOST
          value: "valkey"
        - name: VALKEY_PORT
          value: "6379"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
