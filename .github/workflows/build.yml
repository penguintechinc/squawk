name: Build and Test

on:
  push:
    branches: [ main, 'v*.*.x' ]
  pull_request:
    branches: [ main, 'v*.*.x' ]

env:
  PYTHON_VERSION: '3.13'
  GO_VERSION: '1.24.2'
  NODE_VERSION: '18'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev

    - name: Install dependencies for coverage
      run: |
        cd dns-server && pip install -r requirements.txt pytest pytest-cov

    - name: Run tests with coverage
      run: |
        python3 -m pytest dns-server/tests dns-server/flask_app/tests \
          --cov=dns-server/bins --cov=dns-server/flask_app \
          --cov-report=xml:coverage.xml --cov-report=term-missing \
          --cov-fail-under=98 -v --tb=short || true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@3f20e214133d0983f9a10f3d63b0faf9241a3daa  # v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

    - name: Build DNS Server Docker image for testing
      run: |
        docker build -f dns-server/Dockerfile --build-arg SQUAWK_ENV=test -t squawk-dns-server:test dns-server/

    - name: Run unit tests on complete application image
      run: |
        docker run --rm -w /app/dns-server squawk-dns-server:test python3.13 -m pytest tests/ -v --tb=short

  docker-multi-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

    - name: Build unified Docker image - DNS Server
      run: |
        docker build --target dns-server -t squawk-dns-server-unified:test .

    - name: Build unified Docker image - DNS Client (Go)
      run: |
        docker build --target dns-client -t squawk-dns-client-unified:test .

    - name: Test unified Docker image - DNS Server
      run: |
        docker run --rm squawk-dns-server-unified:test python3.13 --version
        docker run --rm squawk-dns-server-unified:test python -c "import sys; print(f'Virtual env: {sys.prefix}')"
        docker run --rm squawk-dns-server-unified:test python -c "import ldap; print('python-ldap OK')"

    - name: Test unified Docker image - DNS Client
      run: |
        docker run --rm squawk-dns-client-unified:test python3.13 --version
        docker run --rm squawk-dns-client-unified:test python -c "import sys; print(f'Virtual env: {sys.prefix}')"
        docker run --rm squawk-dns-client-unified:test python -c "import dns.resolver; print('DNS Client OK')"

  security-scanning:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

    - name: Set up Python for bandit
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Go for gosec
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run bandit (Python security scanner)
      run: |
        pip install bandit[toml]
        bandit -r . --format json --output bandit-results.json || true
      continue-on-error: true

    - name: Run gosec (Go security scanner)
      uses: securego/gosec@5e5517beec77b8228ba43ec8d7cc22d82ed31924  # v2.25.0
      with:
        args: '-no-fail -fmt json -out gosec-results.json ./...'
      continue-on-error: true

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
      with:
        version: 'v0.69.3'
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3  # v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy'
