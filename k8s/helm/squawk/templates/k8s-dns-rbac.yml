apiVersion: v1
kind: ServiceAccount
metadata:
  name: squawk-k8s-dns
  namespace: {{ include "squawk.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: squawk-k8s-dns
rules:
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: squawk-k8s-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: squawk-k8s-dns
subjects:
- kind: ServiceAccount
  name: squawk-k8s-dns
  namespace: {{ include "squawk.namespace" . }}
