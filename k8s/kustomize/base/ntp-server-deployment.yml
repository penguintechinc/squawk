apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntp-server
  namespace: squawk
  labels:
    app.kubernetes.io/name: squawk
    app.kubernetes.io/component: ntp-server
    app.kubernetes.io/instance: ntp-server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: squawk
      app.kubernetes.io/component: ntp-server
      app.kubernetes.io/instance: ntp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squawk
        app.kubernetes.io/component: ntp-server
        app.kubernetes.io/instance: ntp-server
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ntp-server
        image: ghcr.io/penguintechinc/squawk/ntp-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: ntp-http
          containerPort: 8082
          protocol: TCP
        - name: nts-ke
          containerPort: 4460
          protocol: TCP
        # Rootless container: cannot bind UDP 123 (requires NET_BIND_SERVICE /
        # root). App listens on NTP_UDP_PORT (high port, see env below); the
        # Service below remaps port 123/udp -> targetPort 11123. If a future
        # requirement forces the container itself to bind 123/udp, that is a
        # documented root/capability exception (NET_BIND_SERVICE) requiring
        # explicit user approval per devops-containers.md — do not add it here
        # without that approval.
        - name: ntp-udp
          containerPort: 11123
          protocol: UDP
        env:
        - name: NTP_PORT
          value: "8082"
        - name: NTS_KE_PORT
          value: "4460"
        - name: NTP_UDP_PORT
          value: "11123"
        # NTS-KE (RFC 8915) terminates TLS IN-APP on 4460 because it needs the
        # RFC 5705 TLS exporter to derive NTS cookies — an ingress/Gateway
        # doing TLS termination in front of this port would break NTS-KE.
        # Any external LoadBalancer/Gateway/Ingress fronting port 4460 MUST
        # use TLS/SNI PASSTHROUGH (no TLS termination) — see Service comment
        # in ntp-server-service.yml.
        - name: TLS_CERT_FILE
          value: /etc/ntp-tls/tls.crt
        - name: TLS_KEY_FILE
          value: /etc/ntp-tls/tls.key
        # Shared JWT signing secret — MUST match manager's JWT_SECRET_KEY.
        # Provision out-of-band: kubectl create secret generic squawk-jwt-secret
        #   -n squawk --from-literal=jwt-secret-key=<value>
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: squawk-jwt-secret
              key: jwt-secret-key
        # PostHog feature-flag key — optional; app disables PostHog if unset.
        - name: POSTHOG_KEY
          valueFrom:
            secretKeyRef:
              name: squawk-posthog-secret
              key: posthog-key
              optional: true
        - name: POSTHOG_HOST
          value: "https://license.penguintech.io"
        volumeMounts:
        - name: ntp-tls
          mountPath: /etc/ntp-tls
          readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      # TLS cert/key for NTS-KE (4460) — must be a real cert (RFC 8915
      # requires a TLS exporter, self-signed is fine for alpha/beta).
      # Provision out-of-band: kubectl create secret tls ntp-server-tls
      #   -n squawk --cert=tls.crt --key=tls.key
      - name: ntp-tls
        secret:
          secretName: ntp-server-tls
