name: DNS Server Release

on:
  push:
    branches: ['main', 'v*.*.x']
  pull_request:
    branches: ['main', 'v*.*.x']

env:
  PYTHON_VERSION: '3.13'

jobs:
  # Test job runs on PRs and main pushes
  test:
    name: Test DNS Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install test dependencies
        run: |
          cd dns-server && pip install -r requirements.txt pytest pytest-cov

      - name: Run tests with coverage
        run: |
          # Intentionally non-gating: real aggregate coverage has not yet reached
          # the 98% target here (tracked separately). Do not unmask until the
          # underlying test-coverage work lands.
          python3 -m pytest dns-server/tests \
            --cov=dns-server/app \
            --cov-report=xml:coverage.xml --cov-report=term-missing \
            --cov-fail-under=98 -v --tb=short || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Build complete DNS Server application image for testing
        run: |
          docker build -f dns-server/Dockerfile --build-arg SQUAWK_ENV=test -t squawk-dns-server:release-test dns-server/

      - name: Run Docker unit tests
        run: |
          if [ -d dns-server/tests ]; then
            docker run --rm -w /app/dns-server squawk-dns-server:release-test python3.13 -m pytest tests/ -v --cov=app --cov-report=term-missing --tb=short
          else
            echo "No tests found, skipping test execution"
          fi

      - name: Run security scans on complete application image
        run: |
          docker run --rm -w /app/dns-server squawk-dns-server:release-test python3.13 -m bandit -r app/ -f json || true
          docker run --rm -w /app/dns-server squawk-dns-server:release-test python3.13 -m safety check || true

      - name: Run linting on complete application image
        run: |
          docker run --rm -w /app/dns-server squawk-dns-server:release-test python3.13 -m flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
          docker run --rm -w /app/dns-server squawk-dns-server:release-test python3.13 -m flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

  # Build and release job only runs when version tag created
  build-platform:
    name: Build ${{ matrix.service }} for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - service: dns-server
            target: dns-server
          - service: dns-server-prod
            target: production
          - service: dns-client-python
            target: dns-client
          - service: dns-testing
            target: testing
          - service: dhcp-server
            context: dhcp-server
            dockerfile: dhcp-server/Dockerfile
            image: squawk/dhcp-server
          - service: ntp-server
            context: ntp-server
            dockerfile: ntp-server/Dockerfile
            image: squawk/ntp-server
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref }}
        run: |
          VERSION=${TAG#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Extract platform tag
        id: platform_tag
        run: |
          PLATFORM_TAG=$(echo ${{ matrix.platform }} | sed 's/linux\///')
          echo "tag=$PLATFORM_TAG" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.service }} Docker image for ${{ matrix.platform }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile || './Dockerfile' }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/penguintechinc/${{ matrix.image || format('squawk-{0}', matrix.service) }}:${{ steps.version.outputs.VERSION }}-${{ steps.platform_tag.outputs.tag }}
            ghcr.io/penguintechinc/${{ matrix.image || format('squawk-{0}', matrix.service) }}:latest-${{ steps.platform_tag.outputs.tag }}
          labels: |
            org.opencontainers.image.title=Squawk ${{ matrix.service }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform }}

  merge-manifests:
    name: Merge Docker manifests
    runs-on: ubuntu-latest
    needs: build-platform
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref }}
        run: |
          VERSION=${TAG#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Merge DNS Server manifests
        run: |
          docker buildx imagetools create -t ghcr.io/penguintechinc/squawk-dns-server:${{ steps.version.outputs.VERSION }} \
            ghcr.io/penguintechinc/squawk-dns-server:${{ steps.version.outputs.VERSION }}-amd64 \
            ghcr.io/penguintechinc/squawk-dns-server:${{ steps.version.outputs.VERSION }}-arm64
          docker buildx imagetools create -t ghcr.io/penguintechinc/squawk-dns-server:latest \
            ghcr.io/penguintechinc/squawk-dns-server:latest-amd64 \
            ghcr.io/penguintechinc/squawk-dns-server:latest-arm64

      - name: Merge DNS Server Production manifests
        run: |
          docker buildx imagetools create -t ghcr.io/penguintechinc/squawk-dns-server-prod:${{ steps.version.outputs.VERSION }} \
            ghcr.io/penguintechinc/squawk-dns-server-prod:${{ steps.version.outputs.VERSION }}-amd64 \
            ghcr.io/penguintechinc/squawk-dns-server-prod:${{ steps.version.outputs.VERSION }}-arm64
          docker buildx imagetools create -t ghcr.io/penguintechinc/squawk-dns-server-prod:latest \
            ghcr.io/penguintechinc/squawk-dns-server-prod:latest-amd64 \
            ghcr.io/penguintechinc/squawk-dns-server-prod:latest-arm64

      - name: Merge DNS Client Python manifests
        run: |
          docker buildx imagetools create -t ghcr.io/penguintechinc/squawk-dns-client-python:${{ steps.version.outputs.VERSION }} \
            ghcr.io/penguintechinc/squawk-dns-client-python:${{ steps.version.outputs.VERSION }}-amd64 \
            ghcr.io/penguintechinc/squawk-dns-client-python:${{ steps.version.outputs.VERSION }}-arm64
          docker buildx imagetools create -t ghcr.io/penguintechinc/squawk-dns-client-python:latest \
            ghcr.io/penguintechinc/squawk-dns-client-python:latest-amd64 \
            ghcr.io/penguintechinc/squawk-dns-client-python:latest-arm64

      - name: Merge DNS Testing manifests
        run: |
          docker buildx imagetools create -t ghcr.io/penguintechinc/squawk-dns-testing:${{ steps.version.outputs.VERSION }} \
            ghcr.io/penguintechinc/squawk-dns-testing:${{ steps.version.outputs.VERSION }}-amd64 \
            ghcr.io/penguintechinc/squawk-dns-testing:${{ steps.version.outputs.VERSION }}-arm64
          docker buildx imagetools create -t ghcr.io/penguintechinc/squawk-dns-testing:latest \
            ghcr.io/penguintechinc/squawk-dns-testing:latest-amd64 \
            ghcr.io/penguintechinc/squawk-dns-testing:latest-arm64

      - name: Merge DHCP Server manifests
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker buildx imagetools create -t "ghcr.io/penguintechinc/squawk/dhcp-server:${VERSION}" \
            "ghcr.io/penguintechinc/squawk/dhcp-server:${VERSION}-amd64" \
            "ghcr.io/penguintechinc/squawk/dhcp-server:${VERSION}-arm64"
          docker buildx imagetools create -t ghcr.io/penguintechinc/squawk/dhcp-server:latest \
            ghcr.io/penguintechinc/squawk/dhcp-server:latest-amd64 \
            ghcr.io/penguintechinc/squawk/dhcp-server:latest-arm64

      - name: Merge NTP Server manifests
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker buildx imagetools create -t "ghcr.io/penguintechinc/squawk/ntp-server:${VERSION}" \
            "ghcr.io/penguintechinc/squawk/ntp-server:${VERSION}-amd64" \
            "ghcr.io/penguintechinc/squawk/ntp-server:${VERSION}-arm64"
          docker buildx imagetools create -t ghcr.io/penguintechinc/squawk/ntp-server:latest \
            ghcr.io/penguintechinc/squawk/ntp-server:latest-amd64 \
            ghcr.io/penguintechinc/squawk/ntp-server:latest-arm64

      - name: Capture multi-arch manifest digests
        id: digests
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          for pair in \
            "dns_server:ghcr.io/penguintechinc/squawk-dns-server" \
            "dns_server_prod:ghcr.io/penguintechinc/squawk-dns-server-prod" \
            "dns_client_python:ghcr.io/penguintechinc/squawk-dns-client-python" \
            "dns_testing:ghcr.io/penguintechinc/squawk-dns-testing" \
            "dhcp_server:ghcr.io/penguintechinc/squawk/dhcp-server" \
            "ntp_server:ghcr.io/penguintechinc/squawk/ntp-server"; do
            key="${pair%%:*}"; img="${pair#*:}"
            digest=$(docker buildx imagetools inspect "${img}:${VERSION}" --format '{{.Manifest.Digest}}')
            echo "${key}=${digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Generate SBOM for DNS Server (SPDX-JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ghcr.io/penguintechinc/squawk-dns-server@${{ steps.digests.outputs.dns_server }}
          format: spdx-json
          output-file: sbom-dns-server.spdx.json
          artifact-name: sbom-dns-server.spdx.json

      - name: Generate SBOM for DNS Server Prod (SPDX-JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ghcr.io/penguintechinc/squawk-dns-server-prod@${{ steps.digests.outputs.dns_server_prod }}
          format: spdx-json
          output-file: sbom-dns-server-prod.spdx.json
          artifact-name: sbom-dns-server-prod.spdx.json

      - name: Generate SBOM for DNS Client Python (SPDX-JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ghcr.io/penguintechinc/squawk-dns-client-python@${{ steps.digests.outputs.dns_client_python }}
          format: spdx-json
          output-file: sbom-dns-client-python.spdx.json
          artifact-name: sbom-dns-client-python.spdx.json

      - name: Generate SBOM for DNS Testing (SPDX-JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ghcr.io/penguintechinc/squawk-dns-testing@${{ steps.digests.outputs.dns_testing }}
          format: spdx-json
          output-file: sbom-dns-testing.spdx.json
          artifact-name: sbom-dns-testing.spdx.json

      - name: Generate SBOM for DHCP Server (SPDX-JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ghcr.io/penguintechinc/squawk/dhcp-server@${{ steps.digests.outputs.dhcp_server }}
          format: spdx-json
          output-file: sbom-dhcp-server.spdx.json
          artifact-name: sbom-dhcp-server.spdx.json

      - name: Generate SBOM for NTP Server (SPDX-JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ghcr.io/penguintechinc/squawk/ntp-server@${{ steps.digests.outputs.ntp_server }}
          format: spdx-json
          output-file: sbom-ntp-server.spdx.json
          artifact-name: sbom-ntp-server.spdx.json

      - name: Sign images and attest SBOMs (keyless)
        env:
          COSIGN_YES: "true"
          REF_DNS_SERVER: ghcr.io/penguintechinc/squawk-dns-server@${{ steps.digests.outputs.dns_server }}
          REF_DNS_SERVER_PROD: ghcr.io/penguintechinc/squawk-dns-server-prod@${{ steps.digests.outputs.dns_server_prod }}
          REF_DNS_CLIENT_PYTHON: ghcr.io/penguintechinc/squawk-dns-client-python@${{ steps.digests.outputs.dns_client_python }}
          REF_DNS_TESTING: ghcr.io/penguintechinc/squawk-dns-testing@${{ steps.digests.outputs.dns_testing }}
          REF_DHCP_SERVER: ghcr.io/penguintechinc/squawk/dhcp-server@${{ steps.digests.outputs.dhcp_server }}
          REF_NTP_SERVER: ghcr.io/penguintechinc/squawk/ntp-server@${{ steps.digests.outputs.ntp_server }}
        run: |
          sign_attest() {
            cosign sign --yes "$1"
            cosign attest --yes --predicate "$2" --type spdxjson "$1"
          }
          sign_attest "${REF_DNS_SERVER}" sbom-dns-server.spdx.json
          sign_attest "${REF_DNS_SERVER_PROD}" sbom-dns-server-prod.spdx.json
          sign_attest "${REF_DNS_CLIENT_PYTHON}" sbom-dns-client-python.spdx.json
          sign_attest "${REF_DNS_TESTING}" sbom-dns-testing.spdx.json
          sign_attest "${REF_DHCP_SERVER}" sbom-dhcp-server.spdx.json
          sign_attest "${REF_NTP_SERVER}" sbom-ntp-server.spdx.json

  # Extract release notes and create release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: merge-manifests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref }}
        run: |
          VERSION=${TAG#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Extract Release Notes
        run: |
          chmod +x .github/scripts/extract-release-notes.sh
          GITHUB_REPOSITORY="${{ github.repository }}" \
          GITHUB_SHA="${{ github.sha }}" \
          .github/scripts/extract-release-notes.sh server "${{ steps.version.outputs.VERSION }}" release_body.md

      - name: Create Server Release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e  # v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          release_name: Squawk DNS Server v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          body_path: release_body.md

  # Notification job
  notify:
    name: Notify Server Release
    runs-on: ubuntu-latest
    needs: [test, merge-manifests, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Server Release Summary
        run: |
          echo "✅ Squawk DNS Server Release Complete!"
          echo "Version: ${{ github.ref }}"
          echo "Docker Images: DNS Server (Dev), DNS Server (Prod), Python Client, Testing"
          echo "Features: mTLS, MFA, SSO, DNS Blackholing, Redis Caching, Web Console"
          echo "Registry: ghcr.io/penguintechinc/squawk-*"
