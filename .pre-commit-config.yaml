default_stages: [commit]
fail_fast: false

repos:
  # Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
        name: Detect secrets with gitleaks
        entry: gitleaks protect --staged --source .
        language: system
        pass_filenames: false
        stages: [commit, push]

  # End-of-file fixer
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
        name: Fix end of file
      - id: trailing-whitespace
        name: Fix trailing whitespace
      - id: check-yaml
        name: Check YAML syntax
        args: [--unsafe]
      - id: check-json
        name: Check JSON syntax
      - id: check-merge-conflict
        name: Check merge conflict
      - id: detect-private-key
        name: Detect private keys

  # Python linting
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Lint Python with flake8
        args: ["--max-line-length=120", "--select=E9,F63,F7,F821"]
        files: ^(dns-server|squawk-client|manager).*\.py$
        exclude: (venv|\.venv|migrations|alembic)

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        name: Format Python with black
        args: [--line-length=120]
        files: ^(dns-server|squawk-client|manager).*\.py$
        exclude: (venv|\.venv|migrations|alembic)
        stages: [manual]  # Require explicit opt-in

  # Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports with isort
        args: [--profile=black, --line-length=120]
        files: ^(dns-server|squawk-client|manager).*\.py$
        exclude: (venv|\.venv|migrations|alembic)
        stages: [manual]  # Require explicit opt-in

  # Docker linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles
        stages: [commit, push]

  # Go linting (if golangci-lint is installed)
  - repo: local
    hooks:
      - id: golangci-lint
        name: Lint Go with golangci-lint
        entry: bash -c 'command -v golangci-lint >/dev/null && golangci-lint run squawk-client-go/... || true'
        language: system
        types: [go]
        pass_filenames: false

      # Shell script linting (if shellcheck is installed)
      - id: shellcheck
        name: Lint shell scripts
        entry: bash -c 'command -v shellcheck >/dev/null && find . -name "*.sh" -not -path "*/.git/*" -not -path "*/venv/*" -not -path "*/.venv/*" | xargs shellcheck || true'
        language: system
        types: [shell]
        pass_filenames: false
