# ==========================================================================
# DEPRECATED: Docker Compose support has been deprecated.
# Kubernetes (microk8s) with Helm v3 is now the standard deployment method.
#
# Use instead:
#   Alpha:  make k8s-alpha-deploy
#   Beta:   make k8s-beta-deploy
#   Prod:   make k8s-prod-deploy
#
# See k8s/helm/squawk/ for Helm charts and values files.
# This file is retained for reference only and will be removed in a future release.
# ==========================================================================

version: '3.8'

services:
  # DNS Server with Enterprise Features
  dns-server:
    build:
      context: ./dns-server
      dockerfile: Dockerfile
    image: squawk-dns-server:latest
    container_name: squawk-dns-server
    restart: unless-stopped
    ports:
      - "8080:8080"  # DNS-over-HTTPS API
      - "8444:8443"  # DNS-over-HTTPS API (TLS)
    environment:
      - PORT=8080
      - USE_NEW_AUTH=true
      - LOG_LEVEL=INFO
      - ENABLE_BLACKLIST=false
      - CACHE_ENABLED=true
      - CACHE_TTL=300
      - VALKEY_URL=redis://valkey:6379
      - ENABLE_MTLS=false
      - CERT_DIR=/app/certs
    # volumes removed for local validation to avoid permission issues

    networks:
      squawk-network:
        ipv4_address: 172.25.0.10
    depends_on:
      - valkey
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Flask API Backend (JSON-only, JWT + CORS)
  flask-api:
    build:
      context: ./dns-server
      dockerfile: Dockerfile.api
    image: squawk-flask-api:latest
    container_name: squawk-flask-api
    restart: unless-stopped
    ports:
      - "8005:8000"  # Flask API
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt-secret-change-in-production}
      - JWT_ACCESS_TOKEN_HOURS=1
      - JWT_REFRESH_TOKEN_DAYS=30
      - CORS_ORIGINS=http://localhost:3000,http://dns-webui:3000
      - DATABASE_URI=${DATABASE_URI:-sqlite://storage.db}
      - LOG_LEVEL=INFO
    networks:
      - squawk-network
    depends_on:
      - dns-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Web Console (Nginx + Vite build)
  dns-webui:
    build:
      context: .
      dockerfile: services/dns-webui/Dockerfile
    image: squawk-dns-webui:latest
    container_name: squawk-dns-webui
    restart: unless-stopped
    ports:
      - "3003:3000"  # Web console UI
    environment:
      - VITE_API_URL=http://flask-api:8000
    networks:
      - squawk-network
    depends_on:
      - flask-api

  # DNS Client Forwarder
  dns-client:
    build:
      context: ./dns-client
      dockerfile: Dockerfile
    image: squawk-dns-client:latest
    container_name: squawk-dns-client
    restart: unless-stopped
    ports:
      - "5353:53/udp"
      - "5353:53/tcp"
    cap_add:
      - NET_ADMIN  # Required for DNS port binding
    environment:
      - SQUAWK_SERVER_URL=http://172.25.0.10:8080
      - SQUAWK_AUTH_TOKEN=${AUTH_TOKEN}
      - LOG_LEVEL=INFO
      - SQUAWK_VERIFY_SSL=false
    volumes:
      - ./dns-client/data:/app/data
      - ./dns-client/logs:/app/logs
      - ./dns-client/certs:/app/certs
    networks:
      - squawk-network
    depends_on:
      - dns-server

  # Valkey/Redis Cache
  valkey:
    image: valkey/valkey:latest
    container_name: squawk-valkey
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - valkey-data:/data
    networks:
      - squawk-network
    command: ["valkey-server", "--appendonly", "yes"]

  # PostgreSQL Database (optional - for enterprise deployments)
  postgres:
    image: postgres:15
    container_name: squawk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: squawk
      POSTGRES_USER: squawk_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - squawk-network
    profiles:
      - postgres  # Only start with --profile postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squawk_user -d squawk"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Prometheus Monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: squawk-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - squawk-network
    profiles:
      - monitoring  # Only start with --profile monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana Dashboard (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: squawk-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - squawk-network
    profiles:
      - monitoring  # Only start with --profile monitoring
    depends_on:
      - prometheus

  # Test Runner (unified build with test environment)
  test-runner:
    build:
      context: ./dns-server
      dockerfile: Dockerfile
      args:
        - SQUAWK_ENV=test
    image: squawk-dns-server:latest
    container_name: squawk-test-runner
    environment:
      - SQUAWK_ENV=test
    volumes:
      - ./dns-server:/app/dns-server
    working_dir: /app/dns-server
    networks:
      - squawk-network
    profiles:
      - testing  # Only start with --profile testing

networks:
  squawk-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  valkey-data:
  postgres-data:
  prometheus-data:
  grafana-data: