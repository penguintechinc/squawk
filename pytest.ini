[tool:pytest]
# Pytest configuration for Squawk DNS System

# Test discovery
testpaths = dns-server/tests dns-client/tests dns-server/flask_app/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=98
    --durations=10

# Coverage settings
cov = dns-server/bins dns-client/bins dns-server/flask_app

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security tests
    performance: Performance tests
    slow: Slow running tests
    requires_db: Tests that require database
    requires_network: Tests that require network access
    alpha: Alpha environment tests (local development)
    beta: Beta environment tests (Kubernetes deployment)
    full: Full smoke test suite
    mock: Mock tests without network/database
    edge_cases: Edge case and boundary condition tests
    ux: User experience and UI/UX tests

# Minimum Python version
minversion = 3.8

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
