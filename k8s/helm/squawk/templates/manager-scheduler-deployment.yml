apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager-scheduler
  namespace: {{ include "squawk.namespace" . }}
  labels:
    {{- include "squawk.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager-scheduler
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "squawk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: manager-scheduler
  template:
    metadata:
      labels:
        {{- include "squawk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: manager-scheduler
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager-scheduler
        image: {{ include "squawk.manager.image" . }}
        imagePullPolicy: IfNotPresent
        command:
          - /usr/local/bin/supercronic
          - /app/crontab
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: manager-db
              key: url
        - name: VALKEY_HOST
          value: "{{ include "squawk.fullname" . }}-valkey"
        - name: VALKEY_PORT
          value: "6379"
        - name: LOG_LEVEL
          value: {{ .Values.manager.logLevel | quote }}
        # Asymmetric JWT signing keys (ES256/RS256) — same signer identity as
        # manager. Mounted read-only from the squawk-jwt-keys Secret (see
        # k8s/squawk-jwt-keys.example.yml); never committed to git.
        - name: JWT_PRIVATE_KEY_FILE
          value: "{{ .Values.jwt.mountPath }}/jwt-private-key"
        - name: JWT_PUBLIC_KEY_FILE
          value: "{{ .Values.jwt.mountPath }}/jwt-public-key"
        - name: JWT_ALGORITHM
          value: {{ .Values.jwt.algorithm | quote }}
        - name: JWT_ISSUER
          value: {{ .Values.jwt.issuer | quote }}
        - name: JWT_AUDIENCE
          value: {{ .Values.jwt.audience | quote }}
        - name: TENANT_ID
          value: {{ .Values.manager.tenantId | quote }}
        volumeMounts:
        - name: jwt-keys
          mountPath: {{ .Values.jwt.mountPath }}
          readOnly: true
        resources:
          requests:
            cpu: {{ .Values.manager.resources.requests.cpu }}
            memory: {{ .Values.manager.resources.requests.memory }}
          limits:
            cpu: {{ .Values.manager.resources.limits.cpu }}
            memory: {{ .Values.manager.resources.limits.memory }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: jwt-keys
        secret:
          secretName: {{ include "squawk.jwt.secretName" . }}
          defaultMode: 0440
