apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager-scheduler
  namespace: squawk
  labels:
    app.kubernetes.io/name: squawk
    app.kubernetes.io/component: manager-scheduler
    app.kubernetes.io/instance: manager-scheduler
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 0  # Only one scheduler should run at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: squawk
      app.kubernetes.io/component: manager-scheduler
      app.kubernetes.io/instance: manager-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squawk
        app.kubernetes.io/component: manager-scheduler
        app.kubernetes.io/instance: manager-scheduler
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager-scheduler
        image: ghcr.io/penguintechinc/squawk/manager:latest
        imagePullPolicy: IfNotPresent
        command:
          - /usr/local/bin/supercronic
          - /app/crontab
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: manager-db
              key: url
        - name: VALKEY_HOST
          value: "valkey"
        - name: VALKEY_PORT
          value: "6379"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
