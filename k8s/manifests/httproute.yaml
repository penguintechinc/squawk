apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: squawk
  namespace: squawk
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - "squawk.penguintech.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: flask-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /dns-query
      backendRefs:
        - name: dns-server
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: dns-server
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: webui
          port: 3000
