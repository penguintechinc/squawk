apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-dns
  namespace: {{ include "squawk.namespace" . }}
  labels:
    {{- include "squawk.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-dns
spec:
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.k8sDns.replicas }}
{{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "squawk.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: k8s-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "squawk.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: k8s-dns
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: squawk-k8s-dns
      containers:
      - name: k8s-dns
        image: {{ include "squawk.imageRegistry" . }}/{{ .Values.k8sDns.image.repository }}:{{ .Values.k8sDns.image.tag }}
        imagePullPolicy: {{ .Values.k8sDns.image.pullPolicy | default "Always" }}
        command: ["squawk-k8s-dns", "serve"]
        ports:
        - name: dns-udp
          containerPort: {{ .Values.k8sDns.listenPort }}
          protocol: UDP
        - name: dns-tcp
          containerPort: {{ .Values.k8sDns.listenPort }}
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        env:
        # squawk-k8s-dns refuses a hostname here (it would create a DNS
        # resolution loop bootstrapping its own upstream) -- it requires a
        # literal IP. Use Kubernetes' auto-injected Service env vars
        # (DNS_SERVER_SERVICE_HOST/_PORT, from the "dns-server" Service)
        # instead of a values-driven hostname, since the binary's IP-only
        # requirement is the same in every environment, not alpha-specific.
        - name: SQUAWK_SERVER_URL
          value: "http://$(DNS_SERVER_SERVICE_HOST):$(DNS_SERVER_SERVICE_PORT)/dns/query"
        - name: SQUAWK_UDP_ADDRESS
          value: {{ printf "0.0.0.0:%d" (.Values.k8sDns.listenPort | int) | quote }}
        - name: SQUAWK_TCP_ADDRESS
          value: {{ printf "0.0.0.0:%d" (.Values.k8sDns.listenPort | int) | quote }}
        - name: SQUAWK_CLUSTER_DOMAIN
          value: {{ .Values.k8sDns.env.clusterDomain | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.k8sDns.env.logLevel | quote }}
        resources:
          {{- toYaml .Values.k8sDns.resources | nindent 10 }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
