{{- if .Values.ntpServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntp-server
  namespace: {{ include "squawk.namespace" . }}
  labels:
    {{- include "squawk.ntpServer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ntpServer.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "squawk.ntpServer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "squawk.ntpServer.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ntp-server
        image: {{ include "squawk.imageRegistry" . }}/{{ .Values.ntpServer.image.repository }}:{{ .Values.ntpServer.image.tag }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: ntp-http
          containerPort: 8082
          protocol: TCP
        - name: nts-ke
          containerPort: 4460
          protocol: TCP
        # Rootless container: cannot bind UDP 123 (requires NET_BIND_SERVICE /
        # root). App listens on NTP_UDP_PORT (high port, see env below); the
        # Service below remaps port 123/udp -> targetPort 11123. If a future
        # requirement forces the container itself to bind 123/udp, that is a
        # documented root/capability exception (NET_BIND_SERVICE) requiring
        # explicit user approval per devops-containers.md — do not add it here
        # without that approval.
        - name: ntp-udp
          containerPort: 11123
          protocol: UDP
        env:
        - name: NTP_PORT
          value: "8082"
        - name: NTS_KE_PORT
          value: "4460"
        - name: NTP_UDP_PORT
          value: {{ .Values.ntpServer.env.udpPort | quote }}
        # NTS-KE (RFC 8915) terminates TLS IN-APP on 4460 because it needs the
        # RFC 5705 TLS exporter to derive NTS cookies — an ingress/Gateway
        # doing TLS termination in front of this port would break NTS-KE.
        # Any external LoadBalancer/Gateway/Ingress fronting port 4460 MUST
        # use TLS/SNI PASSTHROUGH (no TLS termination) — see Service comment
        # in ntp-server-service.yml.
        - name: TLS_CERT_FILE
          value: /etc/ntp-tls/tls.crt
        - name: TLS_KEY_FILE
          value: /etc/ntp-tls/tls.key
        # Shared JWT signing secret — MUST match manager's JWT_SECRET_KEY.
        # Provision out-of-band: kubectl create secret generic squawk-jwt-secret
        #   -n squawk --from-literal=jwt-secret-key=<value>
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: squawk-jwt-secret
              key: jwt-secret-key
        # Asymmetric JWT verification (ES256/RS256) — ntp-server verifies
        # tokens signed by manager; public key only, never the private key.
        - name: JWT_PUBLIC_KEY_FILE
          value: "{{ .Values.jwt.mountPath }}/jwt-public-key"
        - name: JWT_ALGORITHM
          value: {{ .Values.jwt.algorithm | quote }}
        - name: JWT_ISSUER
          value: {{ .Values.jwt.issuer | quote }}
        - name: JWT_AUDIENCE
          value: {{ .Values.jwt.audience | quote }}
        # PostHog feature-flag key — optional; app disables PostHog if unset.
        - name: POSTHOG_KEY
          valueFrom:
            secretKeyRef:
              name: squawk-posthog-secret
              key: posthog-key
              optional: true
        - name: POSTHOG_HOST
          value: {{ .Values.ntpServer.env.posthogHost | quote }}
        volumeMounts:
        - name: ntp-tls
          mountPath: /etc/ntp-tls
          readOnly: true
        - name: jwt-public-key
          mountPath: {{ .Values.jwt.mountPath }}
          readOnly: true
        resources:
          {{- toYaml .Values.ntpServer.resources | nindent 10 }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      # TLS cert/key for NTS-KE (4460) — must be a real cert (RFC 8915
      # requires a TLS exporter, self-signed is fine for alpha/beta).
      # Provision out-of-band: kubectl create secret tls ntp-server-tls
      #   -n squawk --cert=tls.crt --key=tls.key
      - name: ntp-tls
        secret:
          secretName: ntp-server-tls
      # ntp-server verifies only — project ONLY jwt-public-key from the
      # shared squawk-jwt-keys Secret; the private key is never mounted here.
      - name: jwt-public-key
        secret:
          secretName: {{ include "squawk.jwt.secretName" . }}
          items:
          - key: jwt-public-key
            path: jwt-public-key
          defaultMode: 0440
{{- end }}
