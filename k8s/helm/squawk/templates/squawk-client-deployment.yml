apiVersion: apps/v1
kind: Deployment
metadata:
  name: squawk-client
  namespace: {{ include "squawk.namespace" . }}
  labels:
    {{- include "squawk.dnsClient.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dnsClient.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "squawk.dnsClient.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "squawk.dnsClient.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: squawk-client
        image: {{ include "squawk.imageRegistry" . }}/{{ .Values.dnsClient.image.repository }}:{{ .Values.dnsClient.image.tag }}
        imagePullPolicy: Always
        args:
          - --server
          - "http://dns-server:8080"
          - --udp
          - --tcp
        env:
        - name: SQUAWK_SERVER_URL
          value: "http://dns-server:8080"
        - name: SQUAWK_UDP_ADDRESS
          value: "0.0.0.0:{{ .Values.dnsClient.listenPort }}"
        - name: SQUAWK_TCP_ADDRESS
          value: "0.0.0.0:{{ .Values.dnsClient.listenPort }}"
        - name: SQUAWK_LISTEN_UDP
          value: "true"
        - name: SQUAWK_LISTEN_TCP
          value: "true"
        ports:
        - name: dns-udp
          containerPort: {{ .Values.dnsClient.listenPort }}
          protocol: UDP
        - name: dns-tcp
          containerPort: {{ .Values.dnsClient.listenPort }}
          protocol: TCP
        resources:
          {{- toYaml .Values.dnsClient.resources | nindent 10 }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          tcpSocket:
            port: {{ .Values.dnsClient.listenPort }}
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: {{ .Values.dnsClient.listenPort }}
          initialDelaySeconds: 5
          periodSeconds: 5
