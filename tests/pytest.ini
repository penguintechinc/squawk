[pytest]
# Pytest configuration for Squawk DNS test suite

# Test discovery
testpaths = smoke unit integration load
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    smoke: Smoke tests - quick verification that services are working
    unit: Unit tests - isolated tests with mocked dependencies
    integration: Integration tests - tests with real services
    load: Load tests - performance and stress testing
    health: Health check tests
    page: Page load tests
    api: API endpoint tests
    auth: Authentication tests
    slow: Slow running tests
    performance: Performance benchmark tests
    stress: Stress tests

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# Timeouts (requires pytest-timeout plugin)
timeout = 60

# Coverage (requires pytest-cov plugin)
# Uncomment to enable coverage
# addopts = --cov=dns-server --cov=manager --cov-report=html

# Parallel execution (requires pytest-xdist plugin)
# Uncomment to enable parallel tests
# addopts = -n auto

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
