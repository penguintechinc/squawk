extends: ["spectral:oas"]

rules:
  # Enforce OpenAPI 3.x (required)
  oas3-schema: error

  # Standard rules - warnings for consistency
  operation-operationId: warn
  operation-description: warn
  operation-tags: warn

  # Info section requirements
  info-contact: off
  info-license: off
  info-description: warn

  # Response codes
  operation-2xx-response: error

  # Naming conventions
  operation-operationId-valid-in-url: warn
  paths-kebab-case: warn
