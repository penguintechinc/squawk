apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-dns
  namespace: squawk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-dns
  template:
    metadata:
      labels:
        app: k8s-dns
    spec:
      serviceAccountName: squawk-k8s-dns
      containers:
      - name: k8s-dns
        image: ghcr.io/penguintechinc/squawk-k8s-dns:latest
        imagePullPolicy: Always
        command: ["squawk-k8s-dns", "serve"]
        ports:
        - name: dns-udp
          containerPort: 5300
          protocol: UDP
        - name: dns-tcp
          containerPort: 5300
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        env:
        - name: SQUAWK_SERVER_URL
          value: "http://dns-server.squawk.svc.cluster.local:8080/dns-query"
        - name: SQUAWK_UDP_ADDRESS
          value: "0.0.0.0:5300"
        - name: SQUAWK_TCP_ADDRESS
          value: "0.0.0.0:5300"
        - name: SQUAWK_CLUSTER_DOMAIN
          value: "cluster.local"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
