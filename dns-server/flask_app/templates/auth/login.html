{% extends "base.html" %}

{% block title %}Admin Login - Squawk DNS{% endblock %}

{% block content %}
<div
    style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
    <div class="card" style="max-width: 450px; width: 100%; margin: 20px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div
                style="width: 64px; height: 64px; background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 32px;">
                🔒
            </div>
            <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 8px;">Admin Console</h1>
            <p style="color: var(--text-secondary); font-size: 14px;">Sign in to manage your DNS infrastructure</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" required autofocus
                    placeholder="admin@example.com">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••">
            </div>

            <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" name="remember" style="width: 16px; height: 16px;">
                    <span style="font-size: 14px; color: var(--text-secondary);">Remember me</span>
                </label>
                <a href="#" style="font-size: 14px; color: var(--primary); text-decoration: none;">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; padding: 14px; font-size: 16px; margin-top: 8px;">
                Sign In
            </button>
        </form>

        <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); text-align: center;">
            <p style="font-size: 13px; color: var(--text-secondary);">
                Squawk DNS Enterprise Admin Console v1.0
            </p>
        </div>
    </div>
</div>
{% endblock %}
