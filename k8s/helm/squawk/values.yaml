global:
  imageRegistry: ghcr.io

namespace:
  create: true
  name: squawk

dnsServer:
  image:
    repository: penguintechinc/squawk
    tag: latest
  replicas: 2
  service:
    port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    squawkServerUrl: "http://localhost:8080"
    valkeyHost: "valkey"
    valkeyPort: "6379"
    logLevel: "info"
    dnsPort: "8080"
    dohPort: "8080"

dnsClient:
  image:
    repository: penguintechinc/squawk-dns-client
    tag: latest
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  listenPort: 5300

valkey:
  image: valkey/valkey
  tag: "8-bookworm"
  digest: "sha256:4a7d243f2890e13198440dcfc8d24c9adf9d4fc4092389c89c12a6fda43d3704"
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

k8sDns:
  image:
    repository: penguintechinc/squawk-k8s-dns
    tag: latest
  replicas: 2
  listenPort: 5300
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  env:
    squawkServerUrl: "http://dns-server.squawk.svc.cluster.local:8080/dns-query"
    clusterDomain: "cluster.local"
    logLevel: "info"

manager:
  image:
    repository: penguintechinc/squawk/manager
    tag: latest
  replicas: 1
  logLevel: "info"
  tenantId: "default"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

dhcpServer:
  enabled: true
  image:
    repository: penguintechinc/squawk/dhcp-server
    tag: latest
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    logLevel: "info"
    poolSubnet: "192.168.1.0/24"
    poolStart: "192.168.1.100"
    poolEnd: "192.168.1.200"
    gateway: "192.168.1.1"
    dnsServers: "8.8.8.8,8.8.4.4"
    leaseTime: "86400"
    posthogHost: "https://license.penguintech.io"

ntpServer:
  enabled: true
  image:
    repository: penguintechinc/squawk/ntp-server
    tag: latest
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    udpPort: "11123"
    posthogHost: "https://license.penguintech.io"

serviceAccount:
  create: false
  name: ""

networkPolicy:
  enabled: true

# Asymmetric JWT keys (ES256/RS256) for user-token auth.
# manager (signer) reads jwt-private-key + jwt-public-key.
# dns-server, dhcp-server, ntp-server (verifiers) read ONLY jwt-public-key.
#
# The Secret is NOT created by this chart — provision it before install:
#   ./scripts/gen-jwt-keys.sh --output /tmp/squawk-jwt-keys
#   kubectl create secret generic squawk-jwt-keys -n squawk \
#     --from-file=jwt-private-key=/tmp/squawk-jwt-keys/jwt_private_key_es256.pem \
#     --from-file=jwt-public-key=/tmp/squawk-jwt-keys/jwt_public_key_es256.pem
# See k8s/squawk-jwt-keys.example.yml for the Secret shape (placeholder only,
# REPLACE — never commit real key material).
jwt:
  secretName: squawk-jwt-keys
  algorithm: ES256
  issuer: squawk-manager
  audience: squawk
  mountPath: /etc/squawk/jwt
