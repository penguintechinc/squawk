# Apply when ready to route external DNS through squawk:
# kubectl --context dal2-beta patch configmap coredns -n kube-system --patch-file k8s/coredns-external-patch.yml
# kubectl --context dal2-beta rollout restart deployment/coredns -n kube-system
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . dns-client.squawk.svc.cluster.local {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
