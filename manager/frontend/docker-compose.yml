# DEPRECATED: Docker Compose support has been deprecated.
# Kubernetes (microk8s) with Helm v3 is now the standard deployment method.
#
# Use instead:
#   Alpha:  make k8s-alpha-deploy
#   Beta:   make k8s-beta-deploy
#   Prod:   make k8s-prod-deploy
#
# See k8s/helm/squawk/ for Helm charts and values files.
# This file is retained for reference only and will be removed in a future release.
# ==========================================================================

version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - squawk-manager
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  squawk-manager:
    external: true
