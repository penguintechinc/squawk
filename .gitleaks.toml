title = "squawk gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known false positives: doc examples, test fixtures, explicit templates, build artifacts"
paths = [
  '''docs/.*''',
  '''tests/.*''',
  '''test_.*\.py''',
  '''.*/test.*\.py''',
  '''.*_test\.py''',
  '''scripts/.*''',
  '''.*\.example\..*''',
  '''__pycache__/.*''',
  '''QUICKSTART\.md''',
]
regexes = [
  '''JBSWY3DPEBLW64TMMQ=*''',
]
