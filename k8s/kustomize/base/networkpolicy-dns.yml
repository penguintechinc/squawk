# Public-facing DNS resolver policies.
#
# Labels sourced from the actual workloads (verified in
# k8s/kustomize/base/dns-server-deployment.yml and dns-client-deployment.yml):
#   app.kubernetes.io/name: squawk
#   app.kubernetes.io/component: dns-server | dns-client
#
# dns-server (Quart app, dns-server/app/main.py) serves DoH, /health and the
# Prometheus /metrics endpoint all on the SAME port (8080/DOH_PORT).
# NetworkPolicy is L3/L4 only, so /metrics cannot be split from /dns/query on
# this port — port 8080 is treated as fully public per product requirement
# (dns-server is the external resolver).
#
# dns-client is the actual public UDP/TCP:53 listener today; it proxies
# queries to dns-server over HTTP (see dns-client-deployment.yml args/env).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-dns-server-public
  namespace: squawk
  labels:
    app.kubernetes.io/name: squawk
    app.kubernetes.io/component: dns-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: squawk
      app.kubernetes.io/component: dns-server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# dns-server performs live upstream DNS resolution (dns.resolver.Resolver in
# dns-server/app/services/dns_resolver.py) and outbound license/feature-flag
# checks (LICENSE_SERVER_URL). Allow egress to the internet on DNS + HTTPS;
# egress to kube-dns/CoreDNS is already covered by allow-egress-kube-dns.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns-server-upstream
  namespace: squawk
  labels:
    app.kubernetes.io/name: squawk
    app.kubernetes.io/component: dns-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: squawk
      app.kubernetes.io/component: dns-server
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-dns-client-public
  namespace: squawk
  labels:
    app.kubernetes.io/name: squawk
    app.kubernetes.io/component: dns-client
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: squawk
      app.kubernetes.io/component: dns-client
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
