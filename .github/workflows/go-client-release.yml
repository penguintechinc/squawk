name: Go Client Build and Release

on:
  push:
    branches: ['main', 'v*.*.x']
    paths:
      - 'squawk-client-go/**'
      - '.github/workflows/go-client-release.yml'
  pull_request:
    branches: ['main', 'v*.*.x']
    paths:
      - 'squawk-client-go/**'
      - '.github/workflows/go-client-release.yml'

env:
  GO_VERSION: '1.24.2'
  APP_NAME: 'squawk-dns-client'

jobs:
  # Test job runs on PRs and pushes
  test:
    name: Test Go Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('squawk-client-go/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        working-directory: squawk-client-go
        run: go mod download

      - name: Run tests
        working-directory: squawk-client-go
        run: make test

      - name: Run linter
        working-directory: squawk-client-go
        run: |
          # v1.64.8 is the last golangci-lint v1 (v2 requires go1.25 to build;
          # CI runs go1.24). Pinned to avoid @latest drift. Migrate to v2 when
          # the repo moves to go1.25.
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          make lint

      - name: Security scan
        working-directory: squawk-client-go
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.11
          make security

  # Build and release job - triggered by version tags
  build-platform:
    name: Build Go Client (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref }}
        run: |
          VERSION=${TAG#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BINARY_NAME=squawk" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Build Go binary for platform
        working-directory: squawk-client-go
        env:
          PLATFORM: ${{ matrix.platform }}
          BINARY_NAME: squawk
          APP_NAME: squawk-dns-client
          GO_VERSION: '1.24.2'
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace \
            --platform ${{ matrix.platform }} \
            golang:${{ env.GO_VERSION }}-bookworm \
            sh -c '
              apt-get update && apt-get install -y --no-install-recommends git

              ARCH=$(echo "${{ matrix.platform }}" | cut -d/ -f2)
              mkdir -p build/$ARCH
              CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build \
                -ldflags "-X main.version=${{ steps.version.outputs.VERSION }} -X main.buildTime=$(date -u +%Y-%m-%d_%H:%M:%S) -X main.gitCommit=${{ github.sha }}" \
                -o build/$ARCH/${{ steps.version.outputs.BINARY_NAME }} \
                ./cmd/squawk-client

              ls -la build/$ARCH/${{ steps.version.outputs.BINARY_NAME }}
            '

      - name: Upload binary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: binaries-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: squawk-client-go/build/

  build-docker-platform:
    name: Build Docker Image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref }}
        run: |
          VERSION=${TAG#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BINARY_NAME=squawk" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (per platform)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          BINARY_NAME: ${{ steps.version.outputs.BINARY_NAME }}
          APP_NAME: squawk-dns-client
        with:
          context: squawk-client-go
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_TIME=$(date -u +%Y-%m-%d_%H:%M:%S)
            GIT_COMMIT=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
          tags: |
            ghcr.io/penguintechinc/${{ env.APP_NAME }}:${{ env.VERSION }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
            ghcr.io/penguintechinc/${{ env.APP_NAME }}:latest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          labels: |
            org.opencontainers.image.title=Squawk DNS Client (Go)
            org.opencontainers.image.description=High-performance DNS-over-HTTPS client
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}

  merge-docker-manifests:
    name: Merge Docker Manifests
    runs-on: ubuntu-latest
    needs: build-docker-platform
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref }}
        run: |
          VERSION=${TAG#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Merge Docker manifests
        env:
          APP_NAME: squawk-dns-client
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/penguintechinc/$APP_NAME:$VERSION \
            ghcr.io/penguintechinc/$APP_NAME:$VERSION-amd64 \
            ghcr.io/penguintechinc/$APP_NAME:$VERSION-arm64

          docker buildx imagetools create \
            -t ghcr.io/penguintechinc/$APP_NAME:latest \
            ghcr.io/penguintechinc/$APP_NAME:latest-amd64 \
            ghcr.io/penguintechinc/$APP_NAME:latest-arm64

  package-release:
    name: Package Release Assets
    runs-on: ubuntu-latest
    needs: build-platform
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref }}
        run: |
          VERSION=${TAG#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BINARY_NAME=squawk" >> $GITHUB_OUTPUT

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8

      - name: Create Release Packages
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          BINARY_NAME: ${{ steps.version.outputs.BINARY_NAME }}
        run: |
          mkdir -p release/packages
          
          if [ -f "binaries-amd64/amd64/$BINARY_NAME" ]; then
            tar -czf release/packages/squawk-$VERSION-linux-amd64.tar.gz -C binaries-amd64/amd64 $BINARY_NAME
          fi

          if [ -f "binaries-arm64/arm64/$BINARY_NAME" ]; then
            tar -czf release/packages/squawk-$VERSION-linux-arm64.tar.gz -C binaries-arm64/arm64 $BINARY_NAME
          fi

          cd release/packages
          sha256sum * > SHA256SUMS

      - name: Upload Release Assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-packages
          path: release/packages/

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [merge-docker-manifests, package-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref }}
        run: |
          VERSION=${TAG#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: release-packages

      - name: Extract Release Notes
        run: |
          chmod +x .github/scripts/extract-release-notes.sh
          GITHUB_REPOSITORY="${{ github.repository }}" \
          GITHUB_SHA="${{ github.sha }}" \
          .github/scripts/extract-release-notes.sh client "${{ steps.version.outputs.VERSION }}" release_body.md

      - name: Create Release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e  # v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          release_name: Squawk DNS Client (Go) v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          body_path: release_body.md

      - name: Upload Release Assets
        if: steps.create_release.outputs.upload_url
        env:
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in squawk-*.tar.gz SHA256SUMS; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              curl -H "Authorization: token $GITHUB_TOKEN" \
                   -H "Content-Type: application/octet-stream" \
                   --data-binary @"$file" \
                   "$UPLOAD_URL?name=$file"
            fi
          done

  # Summary
  notify:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, create-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Build Summary
        env:
          REF: ${{ github.ref }}
        run: |
          echo "✅ Squawk DNS Client (Go) Build Complete!"
          echo "Version: $REF"
          echo "Platforms: Linux (amd64, arm64)"
          echo "Docker: ghcr.io/penguintechinc/squawk-dns-client:$REF"
          echo "Registry: ghcr.io/penguintechinc"
